<main class="error-page">
  <section class="error-card">
    <p class="error-code">401</p>

    <h1>Sign in required</h1>

    <p class="error-description">
      You need to sign in or create an account before accessing this page.
    </p>

    <div class="error-actions">
      <a
        class="primary-button"
        routerLink="/login"
      >
        Sign In
      </a>

      <a
        class="secondary-button"
        routerLink="/signup"
      >
        Create Account
      </a>

      <a
        class="text-link"
        routerLink="/shop"
      >
        Return to Shop
      </a>
    </div>
  </section>
</main>
