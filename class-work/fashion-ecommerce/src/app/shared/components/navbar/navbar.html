<header class="site-header">
  <nav class="navbar">
    <a class="logo" routerLink="/home" aria-label="Trendify home page"> TRENDIFY </a>

    <div class="nav-links">
      <a
        routerLink="/home"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <a routerLink="/shop" routerLinkActive="active-link"> Shop </a>
    </div>

    <div class="navbar-actions">
      <label class="search-box">
        <span class="search-symbol">⌕</span>

        <input
          type="search"
          placeholder="Search products"
          aria-label="Search products"
          (input)="searchProducts($event)"
        />
      </label>

      <a
        class="action-button"
        routerLink="/profile"
        routerLinkActive="active-action"
        aria-label="Open profile"
      >
        &#128100;
      </a>

      <a
        class="action-button favorite-nav-button"
        routerLink="/favorites"
        routerLinkActive="active-action"
        aria-label="Open favorites"
      >
        ♡
      </a>

      <a
        class="action-button cart-button"
        routerLink="/cart"
        routerLinkActive="active-action"
        aria-label="Open shopping cart"
      >
        &#128722; @if (cartCount() > 0) {
        <span class="cart-count"> {{ cartCount() }} </span>
        }
      </a>

      @if (currentUser()?.role === 'admin') {
      <a class="admin-link" routerLink="/admin" routerLinkActive="active-admin-link"> Admin </a>
      }

      <button class="logout-button" type="button" (click)="logout()">Logout</button>
    </div>
  </nav>
</header>
